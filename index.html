<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body data-class="warrior" data-mode="skill">

  <div class="scene">

    <!-- Left control column: mode toggle + 3x3 class grid -->
    <div class="control-column">

      <div class="mode-toggle" role="group" aria-label="Choose a mode">
        <button type="button" class="mode-btn active" data-mode="skill">Skill</button>
        <button type="button" class="mode-btn" data-mode="fun">Fun</button>
      </div>

      <div class="class-grid" role="group" aria-label="Choose a class">
        <button type="button" class="class-btn active" data-class="warrior">
          <span class="class-icon">
            <img src="icons/classicon_warrior.jpg" alt="Warrior">
          </span>
          <span class="class-label">Warrior</span>
        </button>
        <button type="button" class="class-btn" data-class="paladin">
          <span class="class-icon">
            <img src="icons/classicon_paladin.jpg" alt="Paladin">
          </span>
          <span class="class-label">Paladin</span>
        </button>
        <button type="button" class="class-btn" data-class="hunter">
          <span class="class-icon">
            <img src="icons/classicon_hunter.jpg" alt="Hunter">
          </span>
          <span class="class-label">Hunter</span>
        </button>
        <button type="button" class="class-btn" data-class="rogue">
          <span class="class-icon">
            <img src="icons/classicon_rogue.jpg" alt="Rogue">
          </span>
          <span class="class-label">Rogue</span>
        </button>
        <button type="button" class="class-btn" data-class="priest">
          <span class="class-icon">
            <img src="icons/classicon_priest.jpg" alt="Priest">
          </span>
          <span class="class-label">Priest</span>
        </button>
        <button type="button" class="class-btn" data-class="shaman">
          <span class="class-icon">
            <img src="icons/classicon_shaman.jpg" alt="Shaman">
          </span>
          <span class="class-label">Shaman</span>
        </button>
        <button type="button" class="class-btn" data-class="mage">
          <span class="class-icon">
            <img src="icons/classicon_mage.jpg" alt="Mage">
          </span>
          <span class="class-label">Mage</span>
        </button>
        <button type="button" class="class-btn" data-class="warlock">
          <span class="class-icon">
            <img src="icons/classicon_warlock.jpg" alt="Warlock">
          </span>
          <span class="class-label">Warlock</span>
        </button>
        <button type="button" class="class-btn" data-class="druid">
          <span class="class-icon">
            <img src="icons/classicon_druid.jpg" alt="Druid">
          </span>
          <span class="class-label">Druid</span>
        </button>
      </div>

    </div>

    <!-- 3D model, one element reused for whichever class/mode is active -->
    <div class="model-stage">
      <model-viewer
        id="classModel"
        class="race-model"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        alt="3D model of the selected class"
      ></model-viewer>
      <div class="model-placeholder" id="modelPlaceholder">
        <span class="placeholder-glyph">&#9670;</span>
        <p>3D model placeholder<br><span id="placeholderPath"></span></p>
      </div>
    </div>

    <!-- Right side: elegant free-flowing lore text for the selected class/mode -->
    <aside class="lore-panel" aria-label="Class description">
      <p class="lore-text" id="loreText"></p>
    </aside>

    <!-- Bottom-right: opens the fullscreen video for the selected class/mode -->
    <button type="button" class="accept-btn" id="acceptBtn">Accept</button>

    <!-- Bottom-center: flavor text + read-only name field, like the game's screen -->
    <div class="identity-panel">
      <p class="class-text" id="classText"></p>
      <div class="name-field">
        <input type="text" id="classNameInput" readonly aria-label="Character name" tabindex="-1">
      </div>
    </div>

  </div>

  <!-- Fullscreen video overlay, opened by the "Accept" button -->
  <div class="video-modal" id="videoModal" aria-hidden="true">
    <button type="button" class="video-close" id="videoClose" aria-label="Close video">&times;</button>
    <div class="video-frame-wrap" id="videoFrameWrap">
      <iframe
        id="videoFrame"
        title="Class video"
        src=""
        frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
      ></iframe>
    </div>
    <p class="video-missing" id="videoMissing">No video has been set for this class / mode yet.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
